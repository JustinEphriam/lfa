[package]
name = "lfa"
version = "0.1.0"
edition = "2024"

[dependencies]
memchr = "2.8.3"
safe_arch = "1.2.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["fs", "linux_4_11"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
